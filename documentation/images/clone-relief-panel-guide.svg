<text x="48" y="226" fill="#eeeeee" font-family="Arial,sans-serif" font-size="22" font-weight="600">1. Capturer une zone source connexe</text>
<text x="48" y="259" fill="#c8c8c8" font-family="Arial,sans-serif" font-size="16">Ombrage Solid · X-Ray désactivé · surface visible uniquement</text>
<rect x="48" y="278" width="300" height="50" rx="7" fill="#4b4d50" stroke="#606267"/><text x="86" y="311" fill="#eee" font-family="Arial,sans-serif" font-size="19">Capturer la source</text>
<rect x="360" y="278" width="326" height="50" rx="7" fill="#4b4d50" stroke="#606267"/><text x="394" y="311" fill="#eee" font-family="Arial,sans-serif" font-size="19">Resélectionner la source</text>
<text x="48" y="361" fill="#dedede" font-family="Arial,sans-serif" font-size="18">Source : Non capturée</text>
<text x="48" y="411" fill="#eeeeee" font-family="Arial,sans-serif" font-size="22" font-weight="600">2. Sélectionner une zone cible distincte sur ce même maillage</text>
<rect x="48" y="430" width="300" height="50" rx="7" fill="#4b4d50" stroke="#606267"/><text x="84" y="463" fill="#eee" font-family="Arial,sans-serif" font-size="19">Capturer la cible</text>
<rect x="360" y="430" width="326" height="50" rx="7" fill="#4b4d50" stroke="#606267"/><text x="394" y="463" fill="#eee" font-family="Arial,sans-serif" font-size="19">Resélectionner la cible</text>
<text x="48" y="513" fill="#dedede" font-family="Arial,sans-serif" font-size="18">Cible : Non capturée</text>
<line x1="48" y1="548" x2="686" y2="548" stroke="#535559"/>
<text x="48" y="590" fill="#eeeeee" font-family="Arial,sans-serif" font-size="22" font-weight="600">3. Prévisualiser, régler, puis appliquer</text>
<g font-family="Arial,sans-serif" font-size="18" fill="#dedede">
<text x="48" y="638">Intensité</text><text x="48" y="692">Gain du relief</text><text x="48" y="746">Échelle du motif</text><text x="48" y="800">Atténuation du bord</text><text x="48" y="854">Mode de transfert</text><text x="48" y="908">Déplacement maximal</text>
</g>
