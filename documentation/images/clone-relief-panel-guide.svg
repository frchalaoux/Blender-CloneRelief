<rect x="370" y="940" width="316" height="48" rx="7" fill="#477bbd"/><text x="455" y="971" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="600">Appliquer le relief</text>
<line x1="48" y1="1015" x2="686" y2="1015" stroke="#535559"/>
<text x="48" y="1057" fill="#eeeeee" font-family="Arial,sans-serif" font-size="22" font-weight="600">M5. Contrôle du maillage</text>
