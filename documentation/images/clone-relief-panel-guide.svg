<text x="48" y="64" fill="#f2f2f2" font-family="Arial,sans-serif" font-size="30" font-weight="600">Clone Relief</text>
<text x="48" y="125" fill="#dedede" font-family="Arial,sans-serif" font-size="21">Maillage actif prêt  ·  Mode : Mode Édition</text>
