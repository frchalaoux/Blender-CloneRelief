<g fill="#eeeeee" font-family="Arial,sans-serif" font-size="17"><text x="78" y="1105">Contrôler la topologie pour l’impression</text><text x="78" y="1161">Localiser une composante…</text><text x="78" y="1217">Comparer la cible avant/après</text><text x="78" y="1273">Exporter le maillage actif en STL (mm)…</text></g>
<text x="48" y="1335" fill="#eeeeee" font-family="Arial,sans-serif" font-size="22" font-weight="600">Densification de la cible</text>
