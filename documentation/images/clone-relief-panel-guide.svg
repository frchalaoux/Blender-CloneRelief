<text x="48" y="1442" fill="#c8c8c8" font-family="Arial,sans-serif" font-size="16">Schéma simplifié des commandes; le compte rendu est omis.</text>
<text x="48" y="1472" fill="#c8c8c8" font-family="Arial,sans-serif" font-size="16">L’aspect exact varie avec le thème et la version Blender.</text>
